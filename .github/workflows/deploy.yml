name: Deploy Next.js App

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://cgixormdpoqadwxtlycb.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnaXhvcm1kcG9xYWR3eHRseWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MDE1MTEsImV4cCI6MjEwMTI3NzUxMX0.4gHQfGZtOecs8kmKgNJ6y469jokQyGJZVm2vNyr-S2M' }}
        run: npm run build
