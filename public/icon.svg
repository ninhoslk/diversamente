<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo com a paleta holográfica do site -->
  <rect width="512" height="512" rx="128" fill="url(#holoGradient)" />

  <!-- Borda vítrea / glassmorphism -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="white" stroke-opacity="0.4" stroke-width="8" />

  <!-- Letra D estilizada e elegante -->
  <g filter="url(#shadow)">
    <text x="50%" y="67%" font-family="Georgia, 'Playfair Display', serif" font-size="340" font-weight="bold" font-style="italic" fill="url(#textGradient)" text-anchor="middle" dominant-baseline="middle">
      D
    </text>
  </g>

  <!-- Brilho / Sparkle da marca -->
  <path d="M 370 95 Q 370 120 395 120 Q 370 120 370 145 Q 370 120 345 120 Q 370 120 370 95 Z" fill="#ffffff" opacity="0.95" />
</svg>